<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAHI G - AUTO SCAN</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-512.png" type="image/png">
    <style>
        * { box-sizing: border-box; }
        body { 
            background: #02060c; color: #00f2ff; font-family: sans-serif; 
            text-align: center; margin: 0; height: 100vh; 
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 20px; overflow: hidden;
        }
        h1 { font-size: 2.5rem; letter-spacing: 8px; margin: 20px 0; text-shadow: 0 0 15px #00f2ff; }
        
        /* Circular Scan Button */
        .scan-container { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .scan-circle { 
            width: 200px; height: 200px; border-radius: 50%; 
            border: 4px solid #00f2ff; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2); transition: 0.3s;
        }
        .scan-circle:active { transform: scale(0.9); box-shadow: 0 0 40px #00f2ff; }
        .scan-circle b { font-size: 28px; letter-spacing: 3px; }

        #status { margin-top: 20px; font-size: 14px; letter-spacing: 2px; height: 20px; }

        /* Login Credential UI */
        .credentials { width: 100%; max-width: 350px; margin: 0 auto; }
        .info-box { 
            background: rgba(255,255,255,0.05); border: 1px solid rgba(0,242,255,0.2); 
            border-radius: 8px; padding: 10px; margin-bottom: 8px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .copy-btn { background: #00f2ff; color: #000; border: none; padding: 5px 10px; border-radius: 4px; font-weight: bold; font-size: 11px; }

        /* The Result Button */
        #admin-link { 
            display: none; background: #00f2ff; color: #000; 
            padding: 15px; border-radius: 30px; width: 100%; max-width: 300px;
            text-decoration: none; font-weight: bold; margin: 20px auto;
            box-shadow: 0 0 20px #00f2ff;
        }

        footer { font-size: 10px; color: #444; letter-spacing: 1px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h1>MAHI G</h1>

    <div class="scan-container">
        <div class="scan-circle" onclick="runMahiScan()">
            <span style="font-size: 12px; color: #fff;">PRESS</span>
            <b>SCAN</b>
        </div>
        <div id="status">READY TO SCAN</div>
        <a href="#" id="admin-link" target="_blank">OPEN ADMIN PAGE</a>
    </div>

    <div class="credentials">
        <div class="info-box"><span>User: telecomadmin</span><button class="copy-btn" onclick="copy('telecomadmin')">COPY</button></div>
        <div class="info-box"><span>Pass: admintelecom</span><button class="copy-btn" onclick="copy('admintelecom')">COPY</button></div>
        <div class="info-box"><span>User: root</span><button class="copy-btn" onclick="copy('root')">COPY</button></div>
        <div class="info-box"><span>Pass: adminHW</span><button class="copy-btn" onclick="copy('adminHW')">COPY</button></div>
    </div>

    <footer>
        © 2026 COPYRIGHT POWERED BY<br>
        <b style="color:#00f2ff">KAMRAN KHAN</b>
    </footer>

    <script>
        function copy(t) { navigator.clipboard.writeText(t); alert("Copied!"); }

        async function runMahiScan() {
            const status = document.getElementById('status');
            const adminBtn = document.getElementById('admin-link');
            status.innerText = "SCANNING NETWORK...";
            
            // This list covers your 192.168.8.1 and others
            const targets = ["192.168.8.1", "192.168.100.1", "192.168.1.1", "192.168.0.1", "10.0.0.1"];
            let foundIp = null;

            for (let ip of targets) {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 1000); // 1 second per IP

                try {
                    // We use fetch with 'no-cors' to bypass browser blocks
                    await fetch(`http://${ip}/favicon.ico`, { mode: 'no-cors', signal: controller.signal });
                    foundIp = ip;
                    break;
                } catch (e) {
                    // Continue to next IP if one fails
                }
            }

            if (foundIp) {
                status.innerText = "GATEWAY FOUND: " + foundIp;
                adminBtn.href = `http://${foundIp}`;
                adminBtn.style.display = "block";
            } else {
                status.innerText = "NO GATEWAY DETECTED";
                // Fallback to your current IP if scan fails
                adminBtn.href = "http://192.168.8.1";
                adminBtn.style.display = "block";
            }
        }

        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
    </script>
</body>
</html>
