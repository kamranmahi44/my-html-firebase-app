    <title>Wi-Fi Scan</title>

    <style>
        :root { --glow: #00f2fe; --bg: #000; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        html, body { 
            height: 100%; width: 100%; overflow: hidden; 
            background: radial-gradient(circle at center, #0f172a 0%, #000 100%); 
        }

        /* AUTO-LAYOUT FOR ALL DEVICES */
        .app-container {
            display: flex; flex-direction: column; height: 100dvh; width: 100%;
            padding: 15px 20px; justify-content: space-between; align-items: center;
        }

        .logo-text {
            font-size: clamp(2rem, 10vw, 2.8rem); font-weight: 900; letter-spacing: 12px; margin-top: 10px;
            background: linear-gradient(to bottom, #fff, var(--glow));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.5);
        }

        /* BIG SHINING SCAN BUTTON */
        .main-action { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; }
        
        .scan-box { position: relative; width: clamp(220px, 60vw, 300px); height: clamp(220px, 60vw, 300px); display: flex; justify-content: center; align-items: center; }
        .ring { position: absolute; border-radius: 50%; border: 1px solid rgba(0, 242, 254, 0.2); animation: pulse 3s infinite ease-out; }
        .r1 { width: 105%; height: 105%; }
        .r2 { width: 85%; height: 85%; animation-delay: 0.5s; }

        @keyframes pulse { 0% { transform: scale(0.7); opacity: 0; } 50% { opacity: 0.4; } 100% { transform: scale(1.1); opacity: 0; } }

        .scan-btn {
            width: clamp(150px, 40vw, 180px); height: clamp(150px, 40vw, 180px); 
            border-radius: 50%; background: #000; border: 3px solid var(--glow);
            color: var(--glow); z-index: 10; position: relative; overflow: hidden;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer; box-shadow: 0 0 40px rgba(0, 242, 254, 0.4);
        }

        .scan-btn::after {
            content: ''; position: absolute; top: -50%; left: -100%; width: 50%; height: 200%;
            background: rgba(255, 255, 255, 0.2); transform: rotate(30deg); animation: shine 2.5s infinite;
        }
        @keyframes shine { 0% { left: -100%; } 20% { left: 150%; } 100% { left: 150%; } }

        #status-msg { margin-top: 15px; font-size: 13px; font-weight: 800; letter-spacing: 4px; color: var(--glow); text-transform: uppercase; }

        /* SLIM CREDENTIAL FRAMES */
        .cred-list { width: 100%; max-width: 380px; margin-bottom: 5px; }
        .cred-item { height: 36px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; display: flex; justify-content: space-between; align-items: center; padding: 0 12px; margin-bottom: 6px; }
        .cred-item span { color: var(--glow); font-size: 12px; font-weight: bold; }
        .copy-btn { background: var(--glow); border: none; padding: 4px 10px; border-radius: 5px; font-size: 9px; font-weight: 900; color: #000; cursor: pointer; }

        /* FOOTER */
        .footer { text-align: center; padding-bottom: 10px; }
        .ip-info { font-size: 11px; color: #94a3b8; font-weight: bold; margin-bottom: 5px; }
        .author { color: var(--glow); font-weight: bold; font-size: 11px; letter-spacing: 3px; margin-top: 2px; display: block; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="logo-text">MAHI G</div>

        <div class="main-action">
            <div class="scan-box">
                <div class="ring r1"></div>
                <div class="ring r2"></div>
                <div class="scan-btn" onclick="startSmartScan()">
                    <span style="font-size: 0.6rem; opacity: 0.7; letter-spacing: 2px; margin-bottom: 2px;">PRESS</span>
                    <span style="font-size: 1.5rem; font-weight: 900; letter-spacing: 2px;">SCAN</span>
                </div>
            </div>
            <div id="status-msg">READY TO SCAN</div>
        </div>

        <!-- 4 CREDENTIAL FRAMES -->
        <div class="cred-list">
            <div class="cred-item"><span>User: telecomadmin</span><button class="copy-btn" onclick="copy('telecomadmin')">COPY</button></div>
            <div class="cred-item"><span>Pass: admintelecom</span><button class="copy-btn" onclick="copy('admintelecom')">COPY</button></div>
            <div class="cred-item"><span>User: root</span><button class="copy-btn" onclick="copy('root')">COPY</button></div>
            <div class="cred-item"><span>Pass: adminHW</span><button class="copy-btn" onclick="copy('adminHW')">COPY</button></div>
        </div>

        <div class="footer">
            <p class="ip-info">If your IP 192.168.100.1</p>
            <p style="font-size: 9px; color: #475569; letter-spacing: 2px;">© 2026 COPYRIGHT POWERED BY</p>
            <span class="author">KAMRAN KHAN</span>
        </div>
    </div>

<script>
    // Register empty service worker for "Install" support on HTTPS
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('data:text/javascript;base64,c2VsZi5hZGRFdmVudExpc3RlbmVyKCdmZXRjaCcsIGV2ID0+IGV2LnJlc3BvbmRXaXRoKGZldGNoKGV2LnJlcXVlc3QpKSk7');
    }

    function copy(t) {
        navigator.clipboard.writeText(t);
        alert("Copied: " + t);
    }

    /**
     * SMART SCAN LOGIC
     * Because Firebase is HTTPS, we cannot "ping" IPs in the background.
     * We use a "Redirect Sequence" to find the live router.
     */
    function startSmartScan() {
        const status = document.getElementById('status-msg');
        status.innerText = "DEDUCTING IP...";

        // Most likely IPs for your connection
        const ips = ["192.168.100.1", "192.168.8.1", "192.168.1.1"];
        
        // We try to jump to the router's login processor directly.
        // This is the most reliable way on HTTPS hosting like Firebase.
        let currentIndex = 0;

        function tryNext() {
            if (currentIndex < ips.length) {
                let target = "http://" + ips[currentIndex];
                status.innerText = "OPENING " + ips[currentIndex];
                
                // We use a small timeout to let the UI update, then redirect.
                setTimeout(() => {
                    window.location.href = target;
                }, 500);
                
                currentIndex++;
            } else {
                status.innerText = "CHECK WIFI...";
            }
        }

        tryNext();
    }
</script>

</body>
</html>
