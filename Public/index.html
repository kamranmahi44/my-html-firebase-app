<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAHI G - PRO SCAN</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-512.png" type="image/png">
    <style>
        body { background: radial-gradient(circle, #0a192f 0%, #02060c 100%); color: #00f2ff; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; padding: 20px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        
        h1 { font-size: 3rem; letter-spacing: 10px; margin-top: 40px; text-shadow: 0 0 20px #00f2ff; }
        
        /* The Big Circle Scan Button */
        .scan-circle { width: 220px; height: 220px; border-radius: 50%; border: 4px solid #00f2ff; display: flex; flex-direction: column; justify-content: center; align-items: center; margin: 50px auto; cursor: pointer; box-shadow: 0 0 30px rgba(0, 242, 255, 0.3); transition: 0.3s; position: relative; background: rgba(0,0,0,0.5); }
        .scan-circle:active { transform: scale(0.95); box-shadow: 0 0 50px #00f2ff; }
        .scan-circle span { color: #fff; font-size: 14px; letter-spacing: 2px; }
        .scan-circle b { font-size: 32px; letter-spacing: 4px; }

        .status-text { font-size: 18px; letter-spacing: 3px; margin-bottom: 40px; text-transform: uppercase; }

        /* Login Info Boxes */
        .info-box { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(0, 242, 255, 0.2); border-radius: 12px; width: 90%; max-width: 400px; padding: 12px 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .info-box span { font-size: 14px; color: #00f2ff; }
        .copy-btn { background: #00f2ff; color: #000; border: none; padding: 5px 15px; border-radius: 4px; font-weight: bold; font-size: 12px; cursor: pointer; }

        /* Hidden Result Button */
        #result-link { display: none; margin-top: 20px; background: #00f2ff; color: #000; padding: 15px 40px; border-radius: 30px; font-weight: bold; text-decoration: none; box-shadow: 0 0 20px #00f2ff; animation: pulse 1.5s infinite; }
        
        @keyframes pulse { 0% { opacity: 0.8; } 50% { opacity: 1; } 100% { opacity: 0.8; } }
        
        footer { margin-top: auto; font-size: 10px; color: #444; letter-spacing: 2px; padding-bottom: 20px; }
    </style>
</head>
<body>

    <h1>MAHI G</h1>

    <div class="scan-circle" onclick="startMahiScan()">
        <span>PRESS</span>
        <b>SCAN</b>
    </div>

    <div class="status-text" id="status">Ready to Scan</div>

    <div class="info-box"><span>User: telecomadmin</span><button class="copy-btn" onclick="copyText('telecomadmin')">COPY</button></div>
    <div class="info-box"><span>Pass: admintelecom</span><button class="copy-btn" onclick="copyText('admintelecom')">COPY</button></div>
    <div class="info-box"><span>User: root</span><button class="copy-btn" onclick="copyText('root')">COPY</button></div>
    <div class="info-box"><span>Pass: adminHW</span><button class="copy-btn" onclick="copyText('adminHW')">COPY</button></div>

    <a href="#" id="result-link" target="_blank">OPEN MODEM ADMIN</a>

    <footer>
        © 2026 COPYRIGHT POWERED BY<br>
        <b style="color:#00f2ff">KAMRAN KHAN</b>
    </footer>

    <script>
        function copyText(text) {
            navigator.clipboard.writeText(text);
            alert("Copied: " + text);
        }

        async function startMahiScan() {
            const status = document.getElementById('status');
            const link = document.getElementById('result-link');
            const scanBtn = document.querySelector('.scan-circle');

            status.innerText = "Scanning Gateway...";
            status.style.color = "#fff";
            scanBtn.style.borderColor = "#fff";
            
            // The IPs we are looking for
            const gateways = ["192.168.100.1", "192.168.1.1", "192.168.0.1", "192.168.18.1", "192.168.8.1"];
            let found = false;

            for (const ip of gateways) {
                if (found) break;
                
                // Stealth check using Image
                const img = new Image();
                img.src = `http://${ip}/favicon.ico?t=${Date.now()}`;
                
                // We give each IP 1.5 seconds to respond
                const check = new Promise(resolve => {
                    img.onload = () => resolve(true);
                    img.onerror = () => resolve(true); // Many routers block icon requests but exist
                    setTimeout(() => resolve(false), 1500);
                });

                const result = await check;
                if (result) {
                    link.href = `http://${ip}`;
                    link.style.display = "inline-block";
                    status.innerText = "GATEWAY FOUND: " + ip;
                    status.style.color = "#00f2ff";
                    found = true;
                }
            }

            if (!found) {
                status.innerText = "No Gateway Detected";
                // Fallback to default if nothing found
                link.href = "http://192.168.100.1";
                link.style.display = "inline-block";
            }
        }

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
    </html>
