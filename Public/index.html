<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MAHI G - PRO</title>
    <style>
        :root {
            --glow: #00f2fe;
            --bg: #000000;
        }

        /* Forces the app to fit the screen exactly */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: radial-gradient(circle at center, #0f172a 0%, #000 100%);
        }

        /* This wrapper handles the "Full Show" logic */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100dvh; /* Dynamic height for mobile */
            width: 100%;
            padding: 10px 20px;
            justify-content: space-between;
            align-items: center;
        }

        /* 1. TOP SECTION */
        .logo-text {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 10px;
            margin-top: 10px;
            background: linear-gradient(to bottom, #fff, var(--glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
        }

        /* 2. CENTER SECTION (Button & Status) */
        .main-action {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .scan-box {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(0, 242, 254, 0.2);
            animation: pulse 3s infinite ease-out;
        }
        .r1 { width: 100%; height: 100%; }
        .r2 { width: 80%; height: 80%; animation-delay: 0.5s; }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0; }
            50% { opacity: 0.4; }
            100% { transform: scale(1.1); opacity: 0; }
        }

        .scan-btn {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: #000;
            border: 3px solid var(--glow);
            color: var(--glow);
            z-index: 10;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.3);
        }

        .scan-btn::after {
            content: '';
            position: absolute;
            top: -50%; left: -100%;
            width: 50%; height: 200%;
            background: rgba(255, 255, 255, 0.15);
            transform: rotate(30deg);
            animation: shine 2.5s infinite;
        }

        @keyframes shine {
            0% { left: -100%; } 20% { left: 150%; } 100% { left: 150%; }
        }

        #status-msg {
            margin-top: 15px;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 3px;
            color: var(--glow);
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--glow);
        }

        /* 3. CREDENTIALS SECTION (Slimmed down to fit) */
        .cred-list {
            width: 100%;
            max-width: 360px;
            margin-bottom: 5px;
        }

        .cred-item {
            height: 36px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 12px;
            margin-bottom: 6px;
        }

        .cred-item span { color: var(--glow); font-size: 12px; font-weight: bold; }

        .copy-btn {
            background: var(--glow);
            border: none;
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 9px;
            font-weight: 900;
            color: #000;
        }

        /* 4. FOOTER SECTION */
        .footer {
            text-align: center;
            padding-bottom: 5px;
        }

        .ip-notice { font-size: 11px; color: #94a3b8; font-weight: bold; margin-bottom: 8px; }
        .copy-text { font-size: 9px; color: #475569; letter-spacing: 2px; }
        .author { color: var(--glow); font-weight: bold; font-size: 11px; letter-spacing: 3px; margin-top: 2px; display: block; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Logo -->
        <div class="logo-text">MAHI G</div>

        <!-- Main Scan Area -->
        <div class="main-action">
            <div class="scan-box">
                <div class="ring r1"></div>
                <div class="ring r2"></div>
                <div class="scan-btn" onclick="startScan()">
                    <span style="font-size: 0.6rem; opacity: 0.7; letter-spacing: 2px;">PRESS</span>
                    <span style="font-size: 1.3rem; font-weight: 900; letter-spacing: 2px;">SCAN</span>
                </div>
            </div>
            <div id="status-msg">READY TO SCAN</div>
        </div>

        <!-- Credentials -->
        <div class="cred-list">
            <div class="cred-item"><span>User: telecomadmin</span><button class="copy-btn" onclick="copy('telecomadmin')">COPY</button></div>
            <div class="cred-item"><span>Pass: admintelecom</span><button class="copy-btn" onclick="copy('admintelecom')">COPY</button></div>
            <div class="cred-item"><span>User: root</span><button class="copy-btn" onclick="copy('root')">COPY</button></div>
            <div class="cred-item"><span>Pass: adminHW</span><button class="copy-btn" onclick="copy('adminHW')">COPY</button></div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p class="ip-notice">If your IP 192.168.100.1</p>
            <p class="copy-text">© 2026 COPYRIGHT POWERED BY</p>
            <span class="author">KAMRAN KHAN</span>
        </div>
    </div>

<script>
    function copy(t) {
        navigator.clipboard.writeText(t);
        alert("Copied: " + t);
    }

    function startScan() {
        const msg = document.getElementById('status-msg');
        msg.innerText = "SCANNING...";
        setTimeout(() => {
            msg.innerText = "OPENING ADMIN...";
            window.location.href = "http://192.168.8.1";
        }, 1200);
    }
</script>

</body>
</html>
