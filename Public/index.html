<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MAHI G - PRO SCANNER</title>
    <link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
    
<style>
        :root { --glow: #00f2fe; --bg: #000; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        html, body { 
            height: 100%; width: 100%; overflow: hidden; 
            background: radial-gradient(circle at center, #0f172a 0%, #000 100%); 
        }

        /* Ensures the page is always full-screen and fits everything */
        .app-container {
            display: flex; flex-direction: column; height: 100dvh; width: 100%;
            padding: 10px 20px; justify-content: space-between; align-items: center;
        }

        .logo-text {
            font-size: 2.2rem; font-weight: 900; letter-spacing: 10px; margin-top: 10px;
            background: linear-gradient(to bottom, #fff, var(--glow));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
        }

        /* CENTER SCAN AREA */
        .main-action { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; }
        
        .scan-box { position: relative; width: 220px; height: 220px; display: flex; justify-content: center; align-items: center; }
        .ring { position: absolute; border-radius: 50%; border: 1px solid rgba(0, 242, 254, 0.2); animation: pulse 3s infinite ease-out; }
        .r1 { width: 100%; height: 100%; }
        .r2 { width: 80%; height: 80%; animation-delay: 0.5s; }

        @keyframes pulse { 0% { transform: scale(0.7); opacity: 0; } 50% { opacity: 0.4; } 100% { transform: scale(1.1); opacity: 0; } }

        .scan-btn {
            width: 155px; height: 155px; border-radius: 50%; background: #000; border: 3px solid var(--glow);
            color: var(--glow); z-index: 10; position: relative; overflow: hidden;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer; box-shadow: 0 0 40px rgba(0, 242, 254, 0.4);
        }

        .scan-btn::after {
            content: ''; position: absolute; top: -50%; left: -100%; width: 50%; height: 200%;
            background: rgba(255, 255, 255, 0.15); transform: rotate(30deg); animation: shine 2.5s infinite;
        }
        @keyframes shine { 0% { left: -100%; } 20% { left: 150%; } 100% { left: 150%; } }

        #status-msg { margin-top: 15px; font-size: 13px; font-weight: 800; letter-spacing: 3px; color: var(--glow); text-transform: uppercase; text-shadow: 0 0 10px var(--glow); }

        /* SLIM CREDENTIALS */
        .cred-list { width: 100%; max-width: 360px; margin-bottom: 5px; }
        .cred-item { height: 36px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; display: flex; justify-content: space-between; align-items: center; padding: 0 12px; margin-bottom: 6px; }
        .cred-item span { color: var(--glow); font-size: 12px; font-weight: bold; }
        .copy-btn { background: var(--glow); border: none; padding: 4px 10px; border-radius: 5px; font-size: 9px; font-weight: 900; color: #000; cursor: pointer; }

        /* FOOTER */
        .footer { text-align: center; padding-bottom: 15px; }
        .ip-info { font-size: 11px; color: #94a3b8; font-weight: bold; margin-bottom: 5px; }
        .author { color: var(--glow); font-weight: bold; font-size: 11px; letter-spacing: 3px; margin-top: 2px; display: block; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Top Logo -->
        <div class="logo-text">MAHI G</div>

        <!-- Center Scan Button -->
        <div class="main-action">
            <div class="scan-box">
                <div class="ring r1"></div>
                <div class="ring r2"></div>
                <div class="scan-btn" onclick="startLiveScan()">
                    <span style="font-size: 0.6rem; opacity: 0.7; letter-spacing: 2px; margin-bottom: 2px;">PRESS</span>
                    <span style="font-size: 1.4rem; font-weight: 900; letter-spacing: 2px;">SCAN</span>
                </div>
            </div>
            <div id="status-msg">READY TO SCAN</div>
        </div>

        <!-- 4 Slim Frames -->
        <div class="cred-list">
            <div class="cred-item"><span>User: telecomadmin</span><button class="copy-btn" onclick="copy('telecomadmin')">COPY</button></div>
            <div class="cred-item"><span>Pass: admintelecom</span><button class="copy-btn" onclick="copy('admintelecom')">COPY</button></div>
            <div class="cred-item"><span>User: root</span><button class="copy-btn" onclick="copy('root')">COPY</button></div>
            <div class="cred-item"><span>Pass: adminHW</span><button class="copy-btn" onclick="copy('adminHW')">COPY</button></div>
        </div>

        <!-- Copyright & Powered by -->
        <div class="footer">
            <p id="detected-ip" class="ip-info">Scanning Wi-Fi Gateway...</p>
            <p style="font-size: 9px; color: #475569; letter-spacing: 2px;">© 2026 COPYRIGHT POWERED BY</p>
            <span class="author">KAMRAN KHAN</span>
        </div>
    </div>

<script>
    function copy(t) {
        navigator.clipboard.writeText(t);
        alert("Copied: " + t);
    }

    async function startLiveScan() {
        const msg = document.getElementById('status-msg');
        const ipDisplay = document.getElementById('detected-ip');
        msg.innerText = "DETECTING IP...";
        
        // We probe the most common gateways. 
        // 192.168.8.1 is placed first because it's your specific IP.
        const targets = [
            '192.168.8.1',
            '192.168.1.1',
            '192.168.0.1',
            '192.168.100.1',
            '10.0.0.1'
        ];

        let foundGateway = null;

        // Smart Probe: We try to fetch a resource from each IP
        for (const ip of targets) {
            try {
                // We use a very short timeout for speed
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 800);

                const response = await fetch(`http://${ip}`, { 
                    mode: 'no-cors', 
                    signal: controller.signal 
                });

                // If the fetch doesn't throw a "Network Error", the IP is alive
                if (response) {
                    foundGateway = ip;
                    break;
                }
            } catch (e) {
                // If error is NOT a timeout, the IP might exist but block CORS
                if (e.name !== 'AbortError') {
                    foundGateway = ip; 
                    break;
                }
            }
        }

        if (foundGateway) {
            msg.innerText = "FOUND!";
            ipDisplay.innerText = "Connected to Gateway: " + foundGateway;
            setTimeout(() => {
                window.location.href = `http://${foundGateway}`;
            }, 1000);
        } else {
            // If scanning is totally blocked by your phone's firewall, 
            // we open the most common one as a fallback.
            msg.innerText = "OPENING...";
            window.location.href = "http://192.168.8.1";
        }
    }
</script>

</body>
    <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
    </script>
    
</html>
