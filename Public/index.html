<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAHI G - ONE TOUCH</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-512.png" type="image/png">
    <style>
        body { 
            background: #02060c; color: #00f2ff; font-family: sans-serif; 
            text-align: center; margin: 0; height: 100vh; width: 100vw;
            display: flex; flex-direction: column; justify-content: space-around;
            padding: 20px; overflow: hidden; position: fixed;
        }
        h1 { font-size: 2.5rem; letter-spacing: 8px; text-shadow: 0 0 15px #00f2ff; margin: 0; }
        
        .scan-circle { 
            width: 220px; height: 220px; border-radius: 50%; 
            border: 4px solid #00f2ff; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 242, 255, 0.3); margin: 0 auto;
        }
        .scan-circle b { font-size: 32px; letter-spacing: 4px; }
        
        #status { font-size: 14px; letter-spacing: 2px; color: #fff; height: 20px; }

        .credentials { width: 100%; max-width: 350px; }
        .info-box { 
            background: rgba(255,255,255,0.05); border: 1px solid rgba(0,242,255,0.2); 
            border-radius: 8px; padding: 12px; margin-bottom: 8px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .copy-btn { background: #00f2ff; color: #000; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; }

        footer { font-size: 10px; color: #444; letter-spacing: 1px; }
    </style>
</head>
<body>

    <h1>MAHI G</h1>

    <div>
        <div class="scan-circle" id="mainButton" onclick="startAutomaticScan()">
            <span style="font-size: 12px; color: #fff; margin-bottom: 5px;">PRESS</span>
            <b>SCAN</b>
        </div>
        <div id="status">READY TO CONNECT</div>
    </div>

    <div class="credentials">
        <div class="info-box"><span>User: telecomadmin</span><button class="copy-btn" onclick="copy('telecomadmin')">COPY</button></div>
        <div class="info-box"><span>Pass: admintelecom</span><button class="copy-btn" onclick="copy('admintelecom')">COPY</button></div>
    </div>

    <footer>
        © 2026 COPYRIGHT BY <b style="color:#00f2ff">KAMRAN KHAN</b>
    </footer>

    <script>
        function copy(t) { navigator.clipboard.writeText(t); alert("Copied!"); }

        async function startAutomaticScan() {
            const status = document.getElementById('status');
            const btn = document.getElementById('mainButton');
            status.innerText = "DETECTING MODEM...";

            // Every possible fiber/router IP in Oman/Pakistan
            const targets = ["192.168.100.1", "192.168.1.1", "192.168.0.1", "192.168.8.1", "10.0.0.1"];
            let foundIp = null;

            for (let ip of targets) {
                try {
                    // This 'targetAddressSpace' is the 2026 key to bypass blocks!
                    await fetch(`http://${ip}`, { 
                        mode: 'no-cors', 
                        targetAddressSpace: 'local' 
                    });
                    foundIp = ip;
                    break; 
                } catch (e) {
                    // Continue if IP not found
                }
            }

            // SUCCESS: Open the page immediately
            if (foundIp) {
                status.innerText = "CONNECTING TO " + foundIp + "...";
                setTimeout(() => {
                    window.location.href = `http://${foundIp}`;
                }, 1000);
            } else {
                status.innerText = "REDIRECTING TO DEFAULT...";
                window.location.href = "http://192.168.100.1";
            }
        }

        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
    </script>
</body>
</html>
